name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check (node ${{ matrix.node }})
    # Linux/x64 jobs run on the self-hosted nyan-dev-01 runner. A pull request
    # whose code comes from another repository falls back to a GitHub-hosted
    # runner: the self-hosted runner users hold NOPASSWD sudo and the docker
    # group, so untrusted fork code must not execute there. Compare repository
    # names rather than head.repo.fork, which is true for every PR while this
    # repository is itself a fork of an upstream project.
    runs-on: ${{ ((github.event_name == 'pull_request') && (github.event.pull_request.head.repo.full_name != github.repository)) && 'ubuntu-latest' || fromJSON('["self-hosted","Linux","X64","repo-pi-cliproxyapi"]') }}
    strategy:
      fail-fast: false
      matrix:
        # 22.19.0 is the engines floor; 24.x is current. Testing both means the
        # declared minimum is verified rather than assumed.
        node: ["22.19.0", "24.x"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test
